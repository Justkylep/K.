<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Website</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 10px;
      font-family: Arial, sans-serif;
      background: url('download1.jpg')  center center/cover;
      color: rgb(73, 5, 5);
      text-align: center;
    }

    header {
      display: flex;
      justify-content: space-between;
      padding: 10px 50px;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      border: #65b300;
      border-radius: 5px;
    }

    nav {
      display: flex;
      gap: 15px;
    }

    nav a {
      text-decoration: none;
      color: rgb(0, 0, 0);
      border: 1px solid rgb(0, 0, 0);
      padding: 5px 10px;
      border-radius: 5px;
      transition: 0.3s;

    }

    nav a:hover {
      background-color: white;
      color: rgb(0, 0, 0);
    }

    .content {

      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .content h1 {
      font-size: 50px;
      color:orangered;

    }

    .content h1 span {
      color: orangered;
    }

    .buttons {
      margin-top: 20px;
    }

    .buttons a {
      text-decoration: none;
      color: orangered;
      background-color: rgb(0, 0, 0);
      padding: 10px 20px;
      margin: 0 10px;
      border-radius: 5px;
      transition: 0.3s;
    }

    .buttons a:hover {
      background-color: #d48115;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">LOGO</div>
    <nav>
      <a href="#">HOME</a>
      <a href="#">VIDEOS</a>
      <a href="#">BLOG</a>
      <a href="#">PORTFOLIO</a>
      <a href="#">ABOUT US</a>
      <a href="#">CONTACT US</a>
    </nav>
  </header>
  <div class="content">
    <h1>WELCOME TO OUR <span>WEBSITE</span></h1>
    <div class="buttons">
      <a href="#">WATCH VIDEO</a>
      <a href="#">SUBSCRIBE US</a>
    </div>
  </div>
</body>
</html>
